name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check client.js
          node --check index.js
          node --check install.mjs
          node --check uninstall.mjs
      - name: Pure-function tests
        run: node test-pure.mjs
      - name: Smoke tests
        run: node test-smoke.mjs
